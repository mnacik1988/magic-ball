<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✦ Магический Шар ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;1,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 20%, #1a1040 0%, #0a0618 50%, #050310 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    padding: 20px;
    position: relative;
  }

  /* Stars */
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .star {
    position: absolute;
    border-radius: 50%;
    animation: starTwinkle var(--dur) ease-in-out var(--delay) infinite;
  }

  /* Title */
  .title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    font-weight: 900;
    background: linear-gradient(135deg, #c9b8ff 0%, #7c8aff 40%, #b39dff 70%, #e8d5ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.05em;
    text-align: center;
    margin-bottom: 4px;
  }

  .subtitle {
    color: #8a80b0;
    font-size: clamp(0.85rem, 3vw, 1.05rem);
    font-style: italic;
    margin-bottom: 36px;
  }

  /* Ball outer */
  .ball-outer {
    position: relative;
    width: clamp(240px, 65vw, 320px);
    height: clamp(240px, 65vw, 320px);
    animation: float 4s ease-in-out infinite;
  }
  .ball-outer.shaking { animation: shake 0.8s ease-in-out; }

  /* Orbit */
  .orbit-ring {
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 1px solid rgba(124,138,255,0.15);
    animation: orbiting 8s linear infinite;
    pointer-events: none;
  }
  .orbit-dot {
    position: absolute;
    top: 0; left: 50%;
    transform: translate(-50%, -50%);
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #7c8aff;
    box-shadow: 0 0 12px #7c8aff;
  }

  /* Ball body */
  .ball {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2d2255 0%, #151030 45%, #0a0818 80%, #050510 100%);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.7),
      inset 0 -8px 30px rgba(0,0,0,0.5),
      0 0 80px rgba(100,80,200,0.15),
      0 0 120px rgba(60,40,150,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .gloss {
    position: absolute;
    top: 8%; left: 18%;
    width: 35%; height: 25%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.15) 0%, transparent 70%);
    transform: rotate(-20deg);
    pointer-events: none;
  }

  /* Inner window */
  .window {
    width: 45%; height: 45%;
    border-radius: 50%;
    background: radial-gradient(circle, #0d0a20 0%, #06041a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    transition: box-shadow 0.5s ease;
  }

  .number8 {
    font-family: 'Cinzel Decorative', serif;
    font-size: 3rem;
    font-weight: 900;
    color: #3a2d6e;
    text-shadow: 0 0 20px rgba(100,80,200,0.3);
  }

  /* Answer */
  .answer { display: none; text-align: center; padding: 10px; }
  .answer.visible { display: block; animation: fadeInUp 0.6s ease-out; }

  .triangle {
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 20px solid var(--type-color, #7c8aff);
    filter: drop-shadow(0 0 8px var(--type-color, #7c8aff));
    margin: 0 auto 8px;
  }

  .answer-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(0.8rem, 2.5vw, 1rem);
    font-weight: 500;
    font-style: italic;
    line-height: 1.4;
    color: var(--type-color, #7c8aff);
    text-shadow: 0 0 20px color-mix(in srgb, var(--type-color) 25%, transparent);
  }

  /* Loading dots */
  .loading-dots { display: none; gap: 8px; align-items: center; justify-content: center; }
  .loading-dots.visible { display: flex; }
  .loading-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #7c8aff;
    animation: pulse 0.6s ease-in-out infinite;
  }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }

  /* Hint */
  .hint {
    color: #6a60a0;
    font-size: 0.9rem;
    margin-top: 40px;
    animation: pulse 2s ease-in-out infinite;
    text-align: center;
    transition: opacity 0.3s;
  }
  .hint.hidden { opacity: 0; pointer-events: none; }

  .perm-btn {
    background: linear-gradient(135deg, #4a3d8f, #6a5acd);
    border: none;
    color: #e0d8ff;
    padding: 10px 24px;
    border-radius: 30px;
    font-size: 0.9rem;
    font-family: 'Cormorant Garamond', serif;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(100,80,200,0.3);
  }

  /* Badge */
  .badge {
    margin-top: 28px;
    padding: 8px 20px;
    border-radius: 20px;
    border: 1px solid;
    font-size: 0.85rem;
    font-style: italic;
    display: none;
  }
  .badge.visible {
    display: block;
    animation: fadeInUp 0.5s ease-out 0.3s both;
  }

  /* Animations */
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  @keyframes shake {
    0%, 100% { transform: rotate(0deg) scale(1); }
    10% { transform: rotate(-12deg) scale(1.03); }
    20% { transform: rotate(10deg) scale(0.97); }
    30% { transform: rotate(-8deg) scale(1.02); }
    40% { transform: rotate(6deg) scale(0.98); }
    50% { transform: rotate(-4deg) scale(1.01); }
    60% { transform: rotate(3deg) scale(1); }
    70% { transform: rotate(-2deg) scale(1); }
    80% { transform: rotate(1deg) scale(1); }
    90% { transform: rotate(0deg) scale(1); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(18px) scale(0.92); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  @keyframes starTwinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.9; }
  }
  @keyframes orbiting {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<h1 class="title">✦ Магический Шар ✦</h1>
<p class="subtitle">Задай вопрос и тряхни телефон</p>

<div class="ball-outer" id="ballOuter">
  <div class="orbit-ring"><div class="orbit-dot"></div></div>
  <div class="ball">
    <div class="gloss"></div>
    <div class="window" id="window">
      <span class="number8" id="number8">8</span>
      <div class="loading-dots" id="loadingDots">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
      <div class="answer" id="answer">
        <div class="triangle" id="triangle"></div>
        <p class="answer-text" id="answerText"></p>
      </div>
    </div>
  </div>
</div>

<p class="hint" id="hint">Тряхни телефон или нажми на шар ✨</p>
<div class="badge" id="badge"></div>

<script>
const RESPONSES = [
  { text: "Безусловно да!", type: "positive" },
  { text: "Звёзды говорят — ДА", type: "positive" },
  { text: "Без сомнений", type: "positive" },
  { text: "Определённо да", type: "positive" },
  { text: "Можешь быть уверен", type: "positive" },
  { text: "Да, именно так", type: "positive" },
  { text: "Всё сложится наилучшим образом", type: "positive" },
  { text: "Удача на твоей стороне", type: "positive" },
  { text: "Вселенная одобряет", type: "positive" },
  { text: "Это твой шанс — действуй!", type: "positive" },
  { text: "Впереди тебя ждёт приятный сюрприз", type: "positive" },
  { text: "Верь в себя — всё получится", type: "positive" },
  { text: "Спроси позже", type: "neutral" },
  { text: "Сейчас нельзя предсказать", type: "neutral" },
  { text: "Сконцентрируйся и спроси снова", type: "neutral" },
  { text: "Лучше не рассказывать", type: "neutral" },
  { text: "Ответ придёт во сне", type: "neutral" },
  { text: "Подожди — время покажет", type: "neutral" },
  { text: "Слушай своё сердце", type: "neutral" },
  { text: "Тебе решать", type: "neutral" },
  { text: "Загляни внутрь себя", type: "neutral" },
  { text: "Доверься интуиции", type: "neutral" },
  { text: "Мой ответ — нет", type: "negative" },
  { text: "Даже не думай", type: "negative" },
  { text: "Весьма сомнительно", type: "negative" },
  { text: "Не рассчитывай на это", type: "negative" },
  { text: "Перспективы не очень", type: "negative" },
  { text: "Звёзды против", type: "negative" },
  { text: "Сейчас — не лучшее время", type: "negative" },
  { text: "Остерегайся этого пути", type: "negative" },
  { text: "Будь смелее — мир принадлежит храбрым", type: "wisdom" },
  { text: "Не бойся перемен", type: "wisdom" },
  { text: "Улыбнись — и мир улыбнётся тебе", type: "wisdom" },
  { text: "Каждый день — это подарок", type: "wisdom" },
  { text: "Ты сильнее, чем думаешь", type: "wisdom" },
  { text: "Путь в тысячу миль начинается с одного шага", type: "wisdom" },
  { text: "Сегодня отличный день начать что-то новое", type: "wisdom" },
  { text: "Счастье ближе, чем кажется", type: "wisdom" },
];

const TYPE_COLORS = { positive: "#00e676", neutral: "#7c8aff", negative: "#ff5252", wisdom: "#ffd740" };
const TYPE_GLOW = {
  positive: "0 0 40px rgba(0,230,118,0.5)",
  neutral: "0 0 40px rgba(124,138,255,0.5)",
  negative: "0 0 40px rgba(255,82,82,0.4)",
  wisdom: "0 0 40px rgba(255,215,64,0.5)"
};
const TYPE_LABELS = {
  positive: "🌟 Позитивный ответ",
  neutral: "🔮 Загадочный ответ",
  negative: "⚡ Предостережение",
  wisdom: "💫 Мудрость"
};

const ballOuter = document.getElementById("ballOuter");
const windowEl = document.getElementById("window");
const number8 = document.getElementById("number8");
const loadingDots = document.getElementById("loadingDots");
const answerEl = document.getElementById("answer");
const answerText = document.getElementById("answerText");
const triangleEl = document.getElementById("triangle");
const hintEl = document.getElementById("hint");
const badgeEl = document.getElementById("badge");

let lastShake = 0;
let prevIndex = -1;

// Generate stars
const starsContainer = document.getElementById("stars");
for (let i = 0; i < 50; i++) {
  const s = document.createElement("div");
  s.className = "star";
  const size = Math.random() * 3 + 1;
  s.style.width = size + "px";
  s.style.height = size + "px";
  s.style.left = Math.random() * 100 + "%";
  s.style.top = Math.random() * 100 + "%";
  const r = 180 + Math.random() * 75, g = 180 + Math.random() * 75;
  s.style.background = `rgba(${r},${g},255,${0.3 + Math.random()*0.7})`;
  s.style.setProperty("--dur", (2 + Math.random() * 4) + "s");
  s.style.setProperty("--delay", (Math.random() * 3) + "s");
  starsContainer.appendChild(s);
}

function getRandomResponse() {
  let idx;
  do { idx = Math.floor(Math.random() * RESPONSES.length); }
  while (idx === prevIndex && RESPONSES.length > 1);
  prevIndex = idx;
  return RESPONSES[idx];
}

function triggerPrediction() {
  const now = Date.now();
  if (now - lastShake < 2000) return;
  lastShake = now;

  hintEl.classList.add("hidden");
  answerEl.classList.remove("visible");
  badgeEl.classList.remove("visible");
  number8.style.display = "none";
  loadingDots.classList.add("visible");

  ballOuter.classList.remove("shaking");
  void ballOuter.offsetWidth; // reflow
  ballOuter.classList.add("shaking");

  setTimeout(() => {
    const resp = getRandomResponse();
    const color = TYPE_COLORS[resp.type];

    loadingDots.classList.remove("visible");

    windowEl.style.boxShadow = TYPE_GLOW[resp.type];
    document.documentElement.style.setProperty("--type-color", color);
    triangleEl.style.borderBottomColor = color;
    answerText.textContent = resp.text;
    answerText.style.color = color;
    answerEl.classList.add("visible");

    badgeEl.textContent = TYPE_LABELS[resp.type];
    badgeEl.style.background = color + "20";
    badgeEl.style.borderColor = color + "40";
    badgeEl.style.color = color;
    badgeEl.classList.add("visible");
  }, 1200);
}

// Click / tap
document.body.addEventListener("click", triggerPrediction);

// Shake detection
let lastX = 0, lastY = 0, lastZ = 0, lastUpdate = 0;
const SHAKE_THRESHOLD = 25;

function handleMotion(e) {
  const acc = e.accelerationIncludingGravity;
  if (!acc) return;
  const now = Date.now();
  if (now - lastUpdate < 100) return;
  const dx = Math.abs(acc.x - lastX);
  const dy = Math.abs(acc.y - lastY);
  const dz = Math.abs(acc.z - lastZ);
  if (dx + dy + dz > SHAKE_THRESHOLD) triggerPrediction();
  lastX = acc.x; lastY = acc.y; lastZ = acc.z;
  lastUpdate = now;
}
window.addEventListener("devicemotion", handleMotion);

// iOS 13+ permission
if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
  hintEl.innerHTML = '<button class="perm-btn" id="permBtn">Разрешить датчик движения</button>';
  document.getElementById("permBtn").addEventListener("click", async (e) => {
    e.stopPropagation();
    try {
      const perm = await DeviceMotionEvent.requestPermission();
      if (perm === "granted") {
        hintEl.textContent = "Тряхни телефон или нажми на шар ✨";
      }
    } catch {}
  });
}
</script>
</body>
</html>
